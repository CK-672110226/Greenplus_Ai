<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GreenPlus Ai — Wireframes</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --ink:#1a1a1a;
    --ink-2:#3a3a3a;
    --ink-3:#7a7a7a;
    --ink-4:#b8b8b8;
    --paper:#fafaf7;
    --paper-2:#f1efe8;
    --line:#1a1a1a;
    --shadow:#1a1a1a;
    --canvas-bg:#f0eee9;
    --green:#22c55e;
    --green-soft:rgba(34,197,94,.14);
    --green-ink:#0f7a3a;
    --hand:'Architects Daughter', 'Mitr', 'Sarabun', cursive;
    --label:'Caveat', 'Sarabun', cursive;
    --mono:'JetBrains Mono', 'IBM Plex Sans Thai', ui-monospace, monospace;
    --body:'Sarabun', 'IBM Plex Sans Thai', system-ui, sans-serif;
  }
  html[data-theme="dark"]{
    --ink:#ecebe6;
    --ink-2:#c4c2bb;
    --ink-3:#8a8880;
    --ink-4:#4a4842;
    --paper:#15171a;
    --paper-2:#1f2226;
    --line:#3a3d42;
    --shadow:#000;
    --canvas-bg:#0b0c0e;
    --green:#22c55e;
    --green-soft:rgba(34,197,94,.16);
    --green-ink:#5fe093;
  }
  html[data-theme="dark"] body{ color-scheme:dark; }
  html,body{margin:0;padding:0;background:var(--canvas-bg);color:var(--ink);font-family:var(--hand);transition:background .25s;}

  /* dark-mode toggle */
  .theme-toggle{
    position:fixed; top:14px; right:14px; z-index:9999;
    display:flex; gap:0; border:1.5px solid var(--line);
    border-radius:999px; background:var(--paper);
    font-family:var(--mono); font-size:11px; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .theme-toggle button{
    padding:6px 12px; border:0; background:transparent; color:var(--ink-3);
    font:inherit; cursor:pointer; transition:all .15s;
  }
  .theme-toggle button.on{
    background:var(--green); color:#062;
  }
  html[data-theme="dark"] .theme-toggle button.on{ color:#062; }

  /* ===== wireframe primitives ===== */
  .wf{
    background:var(--paper);
    color:var(--ink);
    border:1.5px solid var(--line);
    box-shadow: 3px 3px 0 var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .wf *{box-sizing:border-box;}
  .stroke{ border:1.5px solid var(--line); }
  .stroke-2{ border:2px solid var(--line); }
  .stroke-d{ border:1.5px dashed var(--line); }
  .stroke-t{ border:1.5px dotted var(--ink-3); }

  /* "sketchy" placeholder fills */
  .hatch{
    background-image: repeating-linear-gradient(135deg, var(--ink) 0 1px, transparent 1px 7px);
    opacity:.45;
  }
  .hatch-thin{
    background-image: repeating-linear-gradient(135deg, var(--ink-3) 0 1px, transparent 1px 8px);
  }
  .dot-grid{
    background-image: radial-gradient(var(--ink-4) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .col-grid{
    background-image:
      repeating-linear-gradient(to right,
        transparent 0,
        transparent calc((100% - 11*8px)/12),
        rgba(34,197,94,.12) calc((100% - 11*8px)/12),
        rgba(34,197,94,.12) calc((100% - 11*8px)/12 + 8px));
  }

  /* squiggly "text" lines */
  .squiggle{
    height:6px; border-radius:3px; background:var(--ink-2);
  }
  .squiggle.s2{ height:4px; background:var(--ink-3); }
  .squiggle.s3{ height:3px; background:var(--ink-4); }

  /* tag / chip */
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 9px; border:1.5px solid var(--line);
    border-radius:999px; background:var(--paper);
    font-family:var(--mono); font-size:11px; color:var(--ink);
  }
  .chip.green{ background:var(--green); color:#062; border-color:#0a5; }
  .chip.soft{ background:var(--green-soft); color:var(--green-ink); border-color:var(--green-ink); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:34px; padding:0 14px; border:1.5px solid var(--line);
    background:var(--paper); font-family:var(--label); font-size:18px;
    box-shadow:2px 2px 0 var(--shadow); cursor:pointer;
  }
  .btn.primary{ background:var(--green); color:#062; }
  .btn.ghost{ background:transparent; box-shadow:none; }

  .tag-num{
    font-family:var(--mono); font-size:10px; color:var(--ink-3);
    border:1px dashed var(--ink-4); padding:1px 5px; border-radius:3px;
  }

  .callout{
    position:absolute; font-family:var(--label); color:var(--ink-2);
    font-size:15px; line-height:1.05;
  }
  .callout .arr{
    display:block; font-family:var(--hand); color:var(--ink);
  }
  .pin{
    position:absolute; font-family:var(--mono); font-size:10px;
    color:#fff; background:var(--ink); padding:2px 6px; border-radius:99px;
  }

  h1,h2,h3{ font-family:var(--hand); margin:0; }

  /* ===== Artboard frames ===== */
  .ab{
    width:100%; height:100%;
    display:flex; flex-direction:column;
    background:var(--paper);
  }

  /* ============================================================
     SHELL artboard
     ============================================================ */
  .shell{ width:1280px; height:820px; }
  .shell .topbar{
    height:56px; border-bottom:1.5px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 18px;
    background:var(--paper);
  }
  .shell .brand{
    display:flex; align-items:center; gap:8px;
    font-family:var(--hand); font-size:22px;
  }
  .shell .brand .mark{
    width:28px;height:28px;border:2px solid var(--line);
    background:var(--green); display:inline-flex;
    align-items:center;justify-content:center;
    font-family:var(--hand); font-size:18px; color:#062;
    border-radius:7px;
  }
  .shell .brand b{ font-weight:700; letter-spacing:.5px; }
  .shell .brand .plus{ color:var(--green-ink); }

  .shell .search{
    flex:1; max-width:560px; height:34px;
    border:1.5px solid var(--line); border-radius:6px;
    display:flex; align-items:center; padding:0 12px; gap:10px;
    color:var(--ink-3); font-family:var(--label); font-size:17px;
    background:var(--paper);
  }
  .shell .search .mag{
    width:14px;height:14px;border:1.5px solid var(--ink-2); border-radius:50%;
    position:relative;
  }
  .shell .search .mag::after{
    content:''; position:absolute; right:-5px; bottom:-5px;
    width:7px; height:1.5px; background:var(--ink-2); transform:rotate(45deg);
  }
  .shell .topright{
    margin-left:auto; display:flex; align-items:center; gap:14px;
  }
  .shell .ip{
    display:flex; align-items:center; gap:8px;
    border:1.5px solid var(--line); padding:4px 10px; border-radius:99px;
    font-family:var(--mono); font-size:12px; background:var(--green-soft);
  }
  .shell .ip .dot{ width:8px;height:8px;border-radius:50%;background:var(--green); border:1px solid var(--green-ink);}
  .shell .avatar{
    width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);
    background:var(--paper-2);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--hand); font-size:16px; color:var(--ink-2);
  }

  .shell .body{ flex:1; display:flex; min-height:0; }
  .shell .sidebar{
    width:230px; border-right:1.5px solid var(--line);
    padding:18px 14px; display:flex; flex-direction:column; gap:6px;
    background:var(--paper);
  }
  .shell .nav-h{
    font-family:var(--mono); font-size:10px; letter-spacing:.12em;
    color:var(--ink-3); padding:4px 8px; margin-top:10px;
  }
  .shell .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border:1.5px solid transparent; border-radius:6px;
    font-family:var(--hand); font-size:18px; color:var(--ink);
    cursor:pointer;
  }
  .shell .nav-item .ic{
    width:18px;height:18px; border:1.5px solid var(--line);
    display:inline-block; border-radius:3px;
  }
  .shell .nav-item.active{
    background:var(--green-soft); border-color:var(--green-ink);
    color:var(--green-ink); font-weight:700;
  }
  .shell .nav-item.active .ic{ background:var(--green); border-color:var(--green-ink);}
  .shell .nav-foot{
    margin-top:auto; border-top:1.5px dashed var(--ink-4);
    padding-top:10px; display:flex; flex-direction:column; gap:6px;
  }

  .shell .main{
    flex:1; padding:22px; display:flex; flex-direction:column; gap:18px;
    background:
      linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0)),
      repeating-linear-gradient(to right,
        transparent 0,
        transparent calc((100% - 11*16px)/12),
        rgba(34,197,94,.07) calc((100% - 11*16px)/12),
        rgba(34,197,94,.07) calc((100% - 11*16px)/12 + 16px));
  }
  .shell .pagehead{
    display:flex; align-items:flex-end; justify-content:space-between;
  }
  .shell .pagehead h1{ font-size:34px; }
  .shell .crumbs{ font-family:var(--mono); font-size:11px; color:var(--ink-3);}

  .grid12{
    display:grid; grid-template-columns: repeat(12, 1fr); gap:16px;
  }
  .col-4{ grid-column: span 4; }
  .col-6{ grid-column: span 6; }
  .col-8{ grid-column: span 8; }
  .col-12{ grid-column: span 12; }

  .card{
    border:1.5px solid var(--line); background:var(--paper);
    padding:14px; border-radius:8px;
    box-shadow:2px 2px 0 var(--shadow);
    min-height:120px;
    display:flex; flex-direction:column; gap:8px;
  }
  .card h3{ font-size:20px; }
  .card .kpi{
    font-family:var(--mono); font-size:30px; font-weight:600;
    letter-spacing:-.02em;
  }
  .card .kpi small{
    font-family:var(--label); font-size:16px; color:var(--ink-3);
    font-weight:400; margin-left:6px;
  }

  .placeholder{
    flex:1; border:1.5px dashed var(--ink-4); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-3); font-family:var(--mono); font-size:11px;
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,.04) 0 1px, transparent 1px 10px);
    min-height:80px;
  }

  /* 12-col ruler at top of main */
  .ruler{
    height:14px; display:grid; grid-template-columns:repeat(12,1fr); gap:16px;
    font-family:var(--mono); font-size:9px; color:var(--green-ink);
  }
  .ruler span{
    border-left:1px dashed var(--green-ink);
    padding-left:3px; opacity:.7;
  }

  /* ============================================================
     SCANNER artboard
     ============================================================ */
  .scan{ width:1280px; height:820px; display:grid;
    grid-template-columns: 230px 1fr 320px;
    grid-template-rows: 56px 1fr;
  }
  .scan .topbar{
    grid-column:1/4; border-bottom:1.5px solid var(--line);
    display:flex; align-items:center; padding:0 18px; gap:14px;
    background:var(--paper);
  }
  .scan .sidebar{
    border-right:1.5px solid var(--line); padding:18px 14px;
    display:flex; flex-direction:column; gap:6px; background:var(--paper);
  }
  .scan .stage{
    position:relative;
    background:
      radial-gradient(ellipse at 50% 40%, var(--paper) 0%, var(--paper-2) 70%, var(--canvas-bg) 100%);
    display:flex; flex-direction:column;
    padding:22px; gap:14px;
    overflow:hidden;
  }
  .scan .crumb{
    font-family:var(--mono); font-size:11px; color:var(--ink-3);
  }
  .scan .viewfinder{
    flex:1; position:relative;
    border:2px solid var(--line); border-radius:14px;
    background:
      linear-gradient(135deg, var(--paper) 0%, var(--paper-2) 100%);
    overflow:hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05), 2px 2px 0 var(--shadow);
  }
  /* corner brackets */
  .vf-corner{
    position:absolute; width:32px; height:32px; border:2.5px solid var(--green-ink);
  }
  .vf-corner.tl{ top:14px; left:14px; border-right:0; border-bottom:0;}
  .vf-corner.tr{ top:14px; right:14px; border-left:0; border-bottom:0;}
  .vf-corner.bl{ bottom:14px; left:14px; border-right:0; border-top:0;}
  .vf-corner.br{ bottom:14px; right:14px; border-left:0; border-top:0;}

  /* scanning line */
  .scanline{
    position:absolute; left:8%; right:8%; height:2px;
    background:linear-gradient(to right, transparent, var(--green) 50%, transparent);
    box-shadow:0 0 12px var(--green), 0 0 2px var(--green);
    animation: scan 2.4s ease-in-out infinite;
    top:50%;
  }
  @keyframes scan{
    0%   { top:18%; opacity:.2;}
    50%  { top:82%; opacity:1;}
    100% { top:18%; opacity:.2;}
  }

  /* object placeholder + bounding box */
  .object{
    position:absolute; left:50%; top:55%;
    transform:translate(-50%,-50%);
    width:170px; height:240px;
  }
  .object .bottle{
    width:100%; height:100%;
    background:
      linear-gradient(180deg,
        rgba(34,197,94,.08) 0 18%,
        rgba(0,0,0,.04) 18% 24%,
        rgba(34,197,94,.10) 24% 100%);
    border:1.5px dashed var(--ink-3);
    border-radius:18px 18px 22px 22px / 30px 30px 22px 22px;
    position:relative;
  }
  .object .bottle::before{
    content:''; position:absolute; left:50%; top:-14px;
    transform:translateX(-50%);
    width:30%; height:18px; border:1.5px dashed var(--ink-3); border-bottom:0;
    border-radius:4px 4px 0 0; background:var(--paper);
  }
  .object .bottle::after{
    content:'[ product photo ]';
    position:absolute; left:0; right:0; top:50%;
    transform:translateY(-50%);
    text-align:center;
    font-family:var(--mono); font-size:10px; color:var(--ink-3);
  }
  .bbox{
    position:absolute; inset:-12px;
    border:2px solid var(--green-ink);
    border-radius:6px;
    background:rgba(34,197,94,.05);
  }
  .bbox::before, .bbox::after, .bbox > i, .bbox > b{
    content:''; position:absolute; width:14px; height:14px;
    border:2.5px solid var(--green-ink);
  }
  .bbox::before{ top:-2px; left:-2px; border-right:0; border-bottom:0; }
  .bbox::after { top:-2px; right:-2px; border-left:0; border-bottom:0; }
  .bbox > i{ bottom:-2px; left:-2px; border-right:0; border-top:0; display:block; }
  .bbox > b{ bottom:-2px; right:-2px; border-left:0; border-top:0; display:block; }
  .bbox .label{
    position:absolute; top:-30px; left:-2px;
    background:var(--green-ink); color:#fff;
    font-family:var(--mono); font-size:11px;
    padding:3px 8px; border-radius:4px 4px 4px 0;
    white-space:nowrap;
  }

  /* top-left status pill on stage */
  .vf-status{
    position:absolute; top:18px; left:60px; right:60px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none;
  }

  /* action row */
  .actionrow{
    display:flex; gap:12px; align-items:center;
  }
  .actionrow .btn.primary{ height:42px; font-size:18px; padding:0 18px;}
  .actionrow .spacer{flex:1;}

  /* right panel */
  .scan .right{
    border-left:1.5px solid var(--line);
    background:var(--paper);
    padding:18px 16px;
    display:flex; flex-direction:column; gap:14px;
    overflow:auto;
  }
  .panel-h{
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-h h3{ font-size:20px; }
  .stage-pill{
    font-family:var(--mono); font-size:10px;
    background:var(--ink); color:#fff; padding:2px 7px; border-radius:99px;
  }

  .grade-row{
    display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
    padding:8px 0;
  }
  .grade-row + .grade-row{ border-top:1.5px dashed var(--ink-4); }
  .grade-row .g{
    width:26px;height:26px;border:1.5px solid var(--line); border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--mono); font-weight:600; font-size:13px;
  }
  .grade-row .g.a{ background:var(--green); color:#062;}
  .grade-row .g.b{ background:#fff3a8; color:#5a4a1a;}
  .grade-row .g.c{ background:#fff; color:var(--ink-3);}
  .grade-row .label{ font-family:var(--label); font-size:17px;}
  .grade-row .pct{ font-family:var(--mono); font-size:12px; color:var(--ink-3);}

  .progress{
    height:10px; background:var(--paper-2);
    border:1.5px solid var(--line); border-radius:99px; overflow:hidden;
    position:relative;
  }
  .progress > i{
    display:block; height:100%; background:
      repeating-linear-gradient(45deg, var(--green) 0 6px, var(--green-ink) 6px 12px);
  }
  .progress .ticks{
    position:absolute; inset:0; display:flex; pointer-events:none;
  }
  .progress .ticks span{ flex:1; border-right:1px dashed rgba(0,0,0,.25); }
  .progress .ticks span:last-child{ border-right:0; }

  .calc{
    border:1.5px solid var(--line); border-radius:8px; padding:12px;
    background:var(--green-soft);
    font-family:var(--mono); font-size:12px; color:var(--ink);
    line-height:1.55;
  }
  .calc .row{ display:flex; justify-content:space-between; align-items:baseline; }
  .calc .eq{ border-top:1.5px solid var(--line); margin-top:8px; padding-top:8px;}
  .calc .total{ font-size:22px; font-weight:600; }
  .calc var{ font-style:normal; color:var(--green-ink); font-weight:600;}

  /* ============================================================
     MARKETPLACE artboard
     ============================================================ */
  .mkt{ width:1280px; height:820px; display:grid;
    grid-template-columns: 230px 1fr;
    grid-template-rows: 56px 1fr;
  }
  .mkt .topbar{
    grid-column:1/3; border-bottom:1.5px solid var(--line);
    display:flex; align-items:center; padding:0 18px; gap:14px;
    background:var(--paper);
  }
  .mkt .sidebar{
    border-right:1.5px solid var(--line); padding:18px 14px;
    display:flex; flex-direction:column; gap:6px; background:var(--paper);
  }
  .mkt .content{
    display:grid; grid-template-columns: 1.15fr 1fr; gap:0;
    min-height:0;
  }
  .mkt .pricing{ padding:22px; border-right:1.5px solid var(--line); display:flex; flex-direction:column; gap:14px; min-height:0;}
  .mkt .feed{ padding:22px; display:flex; flex-direction:column; gap:14px; min-height:0;}

  .tabs{
    display:flex; gap:0; border-bottom:1.5px solid var(--line);
  }
  .tabs .t{
    padding:6px 12px; font-family:var(--label); font-size:17px;
    border:1.5px solid transparent; border-bottom:0;
    cursor:pointer; color:var(--ink-3); margin-bottom:-1.5px;
  }
  .tabs .t.active{
    color:var(--ink); border-color:var(--line); background:var(--paper);
  }

  table.price{
    width:100%; border-collapse:collapse;
    font-family:var(--label); font-size:17px;
  }
  table.price th, table.price td{
    text-align:left; padding:10px 8px;
    border-bottom:1.5px dashed var(--ink-4);
  }
  table.price th{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    color:var(--ink-3); font-weight:500;
    border-bottom:1.5px solid var(--line);
    text-transform:uppercase;
  }
  table.price td.mat{ display:flex; align-items:center; gap:10px; }
  table.price td.mat .sw{
    width:22px;height:22px;border:1.5px solid var(--line); border-radius:5px;
  }
  table.price td.mat .sw.p{ background:repeating-linear-gradient(45deg,#e3f7ea 0 4px, #fff 4px 8px);}
  table.price td.mat .sw.pa{ background:repeating-linear-gradient(45deg,#f1ede0 0 4px, #fff 4px 8px);}
  table.price td.mat .sw.m{ background:repeating-linear-gradient(45deg,#e3e3e8 0 4px, #fff 4px 8px);}
  table.price td.mat .sw.g{ background:repeating-linear-gradient(45deg,#e7ecff 0 4px, #fff 4px 8px);}
  table.price td.mat .sw.al{ background:repeating-linear-gradient(45deg,#f3f3f3 0 4px, #fff 4px 8px);}
  table.price td.price-c{ font-family:var(--mono); font-weight:600;}
  table.price td.trend{ color:var(--green-ink); font-family:var(--mono); font-size:12px;}
  table.price td.trend.down{ color:#b94a3a;}
  table.price tr.row-active{ background:var(--green-soft); }
  table.price tr.row-active td:first-child{ border-left:3px solid var(--green-ink); padding-left:5px;}

  .spark{
    width:90px; height:24px; display:block;
  }

  .req-card{
    border:1.5px solid var(--line); border-radius:8px;
    padding:12px; display:grid;
    grid-template-columns: 38px 1fr auto;
    gap:10px; background:var(--paper);
    box-shadow:2px 2px 0 var(--shadow);
  }
  .req-card .ava{
    width:38px;height:38px;border-radius:50%; border:1.5px solid var(--line);
    background:var(--paper-2);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--hand); font-size:16px;
  }
  .req-card .body .name{ font-family:var(--hand); font-size:19px; font-weight:700;}
  .req-card .body .meta{ font-family:var(--mono); font-size:11px; color:var(--ink-3);}
  .req-card .body .want{ font-family:var(--label); font-size:16px; margin-top:4px;}
  .req-card .body .want b{ background:var(--green-soft); padding:0 4px; border-radius:3px;}
  .req-card .deal{ align-self:center;}

  .map{
    flex:0 0 auto; height:160px; border:1.5px solid var(--line); border-radius:8px;
    background:
      radial-gradient(circle at 30% 60%, rgba(34,197,94,.15) 0 8%, transparent 9%),
      radial-gradient(circle at 70% 40%, rgba(34,197,94,.15) 0 10%, transparent 11%),
      linear-gradient(0deg, var(--paper-2), var(--paper-2));
    position:relative; overflow:hidden;
    box-shadow:2px 2px 0 var(--shadow);
  }
  .map::before{
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(90deg, transparent 0 14%, rgba(0,0,0,.08) 14% 14.5%, transparent 14.5% 38%, rgba(0,0,0,.08) 38% 38.5%, transparent 38.5% 62%, rgba(0,0,0,.08) 62% 62.5%, transparent 62.5% 84%, rgba(0,0,0,.08) 84% 84.5%, transparent 84.5%),
      linear-gradient(0deg, transparent 0 22%, rgba(0,0,0,.08) 22% 22.4%, transparent 22.4% 55%, rgba(0,0,0,.08) 55% 55.4%, transparent 55.4% 80%, rgba(0,0,0,.08) 80% 80.4%, transparent 80.4%);
  }
  .map .pinp{
    position:absolute; transform:translate(-50%,-100%);
    font-family:var(--mono); font-size:10px;
  }
  .map .pinp::before{
    content:''; display:block; width:14px; height:14px; margin:0 auto;
    background:var(--green); border:1.5px solid var(--green-ink);
    border-radius:50% 50% 50% 0; transform:rotate(-45deg);
  }
  .map .pinp.me::before{ background:var(--ink); border-color:#000;}
  .map .legend{
    position:absolute; right:8px; top:8px;
    font-family:var(--mono); font-size:10px; color:var(--ink-3);
    background:var(--paper); border:1.5px solid var(--line);
    padding:4px 6px; border-radius:4px;
  }

  /* ============================================================
     CANVAS host
     ============================================================ */
  #root{ width:100%; height:100vh; }

  /* tiny helpers used inside artboards */
  .row{ display:flex; align-items:center; gap:10px;}
  .col{ display:flex; flex-direction:column; gap:8px;}
  .mut{ color:var(--ink-3); }
  .mono{ font-family:var(--mono); font-size:11px; color:var(--ink-3);}
  .mini-label{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase;}

  /* annotation lines */
  .ann{
    position:absolute; font-family:var(--label); color:#b94a3a;
    font-size:14px; line-height:1.05;
    pointer-events:none;
  }
  .ann b{ color:#b94a3a;}
  .ann .arrow{
    display:block; width:40px; height:14px; margin-top:2px;
    background:
      linear-gradient(#b94a3a,#b94a3a) center/100% 1px no-repeat;
    position:relative;
  }
  .ann .arrow::after{
    content:''; position:absolute; right:0; top:50%;
    width:8px; height:8px; border-right:1.5px solid #b94a3a; border-top:1.5px solid #b94a3a;
    transform:translateY(-50%) rotate(45deg);
  }

  /* ============================================================
     MOBILE — phone frame + screens
     ============================================================ */
  .phone{
    width:390px; height:844px;
    border:2px solid var(--line); border-radius:46px;
    background:var(--paper);
    padding:10px;
    box-shadow: 4px 4px 0 var(--shadow), inset 0 0 0 1.5px var(--canvas-bg);
    position:relative;
    box-sizing:border-box;
  }
  .phone .screen{
    width:100%; height:100%;
    border-radius:36px; overflow:hidden;
    background:var(--paper);
    display:flex; flex-direction:column;
    position:relative;
  }
  .phone .notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:118px; height:30px; background:var(--line);
    border-radius:99px; z-index:20;
  }
  .status-bar{
    height:44px; padding:14px 28px 0; display:flex;
    align-items:center; justify-content:space-between;
    font-family:var(--mono); font-size:12px; color:var(--ink);
    flex:0 0 auto;
  }
  .status-bar .ind{ display:flex; gap:6px; align-items:center;}
  .status-bar .bat{
    width:22px; height:11px; border:1px solid var(--ink); border-radius:2px;
    position:relative; padding:1px;
  }
  .status-bar .bat::after{
    content:''; position:absolute; right:-3px; top:3px; width:2px; height:5px;
    background:var(--ink); border-radius:0 2px 2px 0;
  }
  .status-bar .bat i{ display:block; width:75%; height:100%; background:var(--green); border-radius:1px;}

  .m-head{
    padding:6px 18px 10px; display:flex; align-items:center; gap:10px;
    border-bottom:1.5px solid var(--line); background:var(--paper);
    flex:0 0 auto;
  }
  .m-head .brand{
    display:flex; align-items:center; gap:7px;
    font-family:var(--hand); font-size:19px;
  }
  .m-head .brand .mark{
    width:26px;height:26px;border:1.5px solid var(--line);
    background:var(--green); display:inline-flex;
    align-items:center;justify-content:center;
    font-family:var(--hand); font-size:16px; color:#062;
    border-radius:7px;
  }
  .m-head .ip{
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
    border:1.5px solid var(--line); padding:3px 9px; border-radius:99px;
    font-family:var(--mono); font-size:11px; background:var(--green-soft);
  }
  .m-head .ip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);border:1px solid var(--green-ink);}
  .m-head .avatar{
    width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);
    background:var(--paper-2);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--hand); font-size:14px; color:var(--ink-2);
  }

  .m-body{
    flex:1; min-height:0; overflow:auto;
    padding:14px 16px 16px;
    display:flex; flex-direction:column; gap:12px;
    background:var(--paper);
  }
  .m-body h1{ font-size:24px; line-height:1.05;}
  .m-body h2{ font-size:18px; }

  .tabbar{
    flex:0 0 auto; height:72px;
    border-top:1.5px solid var(--line);
    background:var(--paper);
    display:grid; grid-template-columns:repeat(4,1fr);
    padding:8px 8px 18px;
  }
  .tabbar .ti{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-family:var(--mono); font-size:9px; letter-spacing:.08em;
    color:var(--ink-3); text-transform:uppercase;
    cursor:pointer;
  }
  .tabbar .ti .ic{
    width:22px;height:22px;border:1.5px solid var(--line); border-radius:5px;
  }
  .tabbar .ti.active{ color:var(--green-ink); }
  .tabbar .ti.active .ic{ background:var(--green); border-color:var(--green-ink);}
  .tabbar .ti.scan .ic{
    width:46px;height:46px;border-radius:50%;
    background:var(--green); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    margin-top:-10px;
    color:#062; font-family:var(--hand); font-size:22px;
    box-shadow:0 4px 0 var(--shadow);
  }
  .tabbar .ti.scan{ font-weight:700; color:var(--green-ink); }

  .m-card{
    border:1.5px solid var(--line); border-radius:10px; padding:12px;
    background:var(--paper);
    display:flex; flex-direction:column; gap:6px;
    box-shadow:2px 2px 0 var(--shadow);
  }
  .m-card .kpi{
    font-family:var(--mono); font-size:24px; font-weight:600; letter-spacing:-.02em;
  }
  .m-card .kpi small{
    font-family:var(--label); font-size:14px; color:var(--ink-3); font-weight:400; margin-left:4px;
  }
  .m-row{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1.5px dashed var(--ink-4);
  }
  .m-row:last-child{ border-bottom:0; }

  /* Mobile scanner */
  .m-scan-stage{
    flex:1; position:relative; background:#000;
    border-radius:18px; overflow:hidden;
    border:1.5px solid var(--line);
  }
  html[data-theme="dark"] .m-scan-stage{ background:#05060a;}
  .m-scan-stage .vf-corner{ border-color:var(--green);}
  .m-scan-stage .scanline{
    background:linear-gradient(to right, transparent, var(--green) 50%, transparent);
    box-shadow:0 0 14px var(--green);
  }
  .m-scan-stage .object{
    left:50%; top:48%; width:120px; height:180px;
  }
  .m-scan-stage .object .bottle{
    background:
      linear-gradient(180deg,
        rgba(34,197,94,.10) 0 18%,
        rgba(255,255,255,.05) 18% 24%,
        rgba(34,197,94,.12) 24% 100%);
    border-color:rgba(255,255,255,.4);
  }
  .m-scan-stage .object .bottle::before{
    background:transparent; border-color:rgba(255,255,255,.4);
  }
  .m-scan-stage .object .bottle::after{ color:rgba(255,255,255,.6);}
  .m-scan-stage .bbox{ border-color:var(--green);}
  .m-scan-stage .bbox::before,.m-scan-stage .bbox::after,.m-scan-stage .bbox > i,.m-scan-stage .bbox > b{
    border-color:var(--green);
  }
  .m-scan-stage .bbox .label{
    background:var(--green); color:#062;
  }
  .m-scan-stage .m-overlay{
    position:absolute; left:12px; right:12px; top:12px;
    display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-family:var(--mono); font-size:10px;
  }
  .m-scan-stage .chip-dark{
    background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.25);
    padding:4px 8px; border-radius:99px; backdrop-filter:blur(4px);
  }

  .m-sheet{
    flex:0 0 auto; background:var(--paper);
    border-top:1.5px solid var(--line);
    margin-top:-18px; padding:14px 16px 12px;
    border-radius:18px 18px 0 0;
    position:relative;
    display:flex; flex-direction:column; gap:8px;
    box-shadow:0 -4px 0 var(--shadow);
  }
  .m-sheet::before{
    content:''; position:absolute; top:6px; left:50%; transform:translateX(-50%);
    width:42px; height:4px; background:var(--ink-4); border-radius:99px;
  }
  .m-sheet .row-flex{ display:flex; gap:8px;}
  .m-sheet .row-flex > *{ flex:1; }

  /* Mobile pricing list */
  .m-price-row{
    display:grid; grid-template-columns:auto 1fr auto auto;
    gap:10px; align-items:center;
    padding:10px 4px;
    border-bottom:1.5px dashed var(--ink-4);
  }
  .m-price-row .sw{
    width:28px;height:28px;border:1.5px solid var(--line); border-radius:6px;
  }
  .m-price-row .sw.p { background:repeating-linear-gradient(45deg,rgba(34,197,94,.18) 0 4px, transparent 4px 8px);}
  .m-price-row .sw.pa{ background:repeating-linear-gradient(45deg,rgba(170,150,80,.22) 0 4px, transparent 4px 8px);}
  .m-price-row .sw.al{ background:repeating-linear-gradient(45deg,rgba(180,180,180,.22) 0 4px, transparent 4px 8px);}
  .m-price-row .name{ font-family:var(--label); font-size:17px; line-height:1.1;}
  .m-price-row .sub{ font-family:var(--mono); font-size:10px; color:var(--ink-3);}
  .m-price-row .price{ font-family:var(--mono); font-size:14px; font-weight:600; text-align:right;}
  .m-price-row .delta{ font-family:var(--mono); font-size:10px; color:var(--green-ink); text-align:right;}
  .m-price-row .delta.down{ color:#d96a5a;}

  .m-seg{
    display:flex; padding:3px; border:1.5px solid var(--line); border-radius:99px;
    background:var(--paper-2); font-family:var(--mono); font-size:11px;
  }
  .m-seg .s{
    flex:1; text-align:center; padding:6px 8px; border-radius:99px;
    color:var(--ink-3); cursor:pointer;
  }
  .m-seg .s.on{
    background:var(--paper); color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }

  .m-req{
    border:1.5px solid var(--line); border-radius:10px; padding:11px;
    background:var(--paper);
    display:grid; grid-template-columns:32px 1fr auto;
    gap:10px; align-items:center;
    box-shadow:2px 2px 0 var(--shadow);
  }
  .m-req .ava{
    width:32px;height:32px;border-radius:50%; border:1.5px solid var(--line);
    background:var(--paper-2);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--hand); font-size:14px;
  }
  .m-req .body .name{ font-family:var(--hand); font-size:17px; font-weight:700; line-height:1.05;}
  .m-req .body .meta{ font-family:var(--mono); font-size:10px; color:var(--ink-3);}
  .m-req .body .want{ font-family:var(--label); font-size:14px; margin-top:2px;}
  .m-req .body .want b{ background:var(--green-soft); padding:0 4px; border-radius:3px;}
  .m-req .deal{ font-family:var(--mono); font-size:12px; font-weight:600; color:var(--green-ink);
    border:1.5px solid var(--green-ink); padding:4px 8px; border-radius:99px; background:var(--green-soft);}

  /* ============================================================
     ATOMS — shared primitives
     ============================================================ */
  .field-row{
    display:grid; grid-template-columns:140px 1fr; gap:14px;
    align-items:baseline; padding:9px 0;
    border-bottom:1.5px dashed var(--ink-4);
  }
  .field-row:last-child{ border-bottom:0; }
  .field-row .field-label{ display:flex; flex-direction:column; gap:2px;}
  .field-row .field-value{ font-family:var(--label); font-size:17px; color:var(--ink);}
  .field-row .field-value.mono-val{ font-family:var(--mono); font-size:13px; font-weight:600;}

  .sec-div{ display:flex; align-items:center; gap:10px; margin:6px 0;}
  .sec-div .line{ flex:1; height:1.5px; background:var(--ink-4); border-radius:1px;}
  .sec-div .lbl{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    color:var(--ink-3); text-transform:uppercase;
  }

  .wf-input{ display:flex; flex-direction:column; gap:6px;}
  .wf-input-row{
    display:flex; align-items:center; gap:10px;
    border:1.5px solid var(--line); border-radius:6px;
    padding:9px 12px; background:var(--paper);
    box-shadow: inset 0 1px 0 rgba(0,0,0,.03);
  }
  .wf-input-text{ flex:1; font-family:var(--label); font-size:17px; color:var(--ink);}
  .wf-input-ic{
    width:16px;height:16px; border:1.5px solid var(--ink-2); border-radius:3px;
    display:inline-block; flex:0 0 auto;
  }

  /* ============================================================
     LANDING — split role chooser
     ============================================================ */
  .landing{
    width:1280px; height:820px;
    display:grid; grid-template-rows:64px 1fr; background:var(--paper);
  }
  .landing .hero-top{
    border-bottom:1.5px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:0 28px; background:var(--paper);
  }
  .landing .hero-top .links{
    margin-left:auto; display:flex; gap:18px;
    font-family:var(--label); font-size:17px; color:var(--ink-2);
  }
  .landing .hero{ display:grid; grid-template-columns:1.05fr .95fr; min-height:0;}
  .landing .copy{
    padding:60px 56px; display:flex; flex-direction:column; gap:18px;
    background:
      radial-gradient(ellipse at 0% 0%, var(--green-soft) 0%, transparent 50%),
      var(--paper);
    border-right:1.5px solid var(--line);
  }
  .landing .copy h1{ font-size:66px; line-height:.95; letter-spacing:-.02em; text-wrap:balance;}
  .landing .copy .lede{
    font-family:var(--label); font-size:24px; color:var(--ink-2); max-width:520px;
  }
  .landing .copy .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:18px;
    margin-top:auto; padding-top:24px; border-top:1.5px dashed var(--ink-4);
  }
  .landing .copy .stat .n{
    font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:-.02em;
    color:var(--green-ink);
  }
  .landing .copy .stat .l{
    font-family:var(--mono); font-size:11px; color:var(--ink-3);
    letter-spacing:.1em; text-transform:uppercase;
  }
  .landing .choose{
    padding:60px 56px; display:flex; flex-direction:column; gap:20px;
    background:var(--paper-2);
  }
  .landing .choose h2{ font-family:var(--hand); font-size:28px;}
  .role-card{
    border:1.5px solid var(--line); border-radius:12px; background:var(--paper);
    padding:22px 22px 18px;
    display:grid; grid-template-columns:64px 1fr auto; gap:18px;
    align-items:center; box-shadow:3px 3px 0 var(--shadow);
    cursor:pointer; transition:transform .12s;
  }
  .role-card:hover{ transform:translate(-1px,-1px);}
  .role-card.green{ background:var(--green-soft); border-color:var(--green-ink);}
  .role-card .icon{
    width:64px; height:64px; border-radius:14px;
    border:2px solid var(--line); background:var(--green);
    display:grid; place-items:center;
    font-family:var(--hand); font-size:32px; color:#062;
  }
  .role-card .icon.buyer{ background:var(--paper); }
  .role-card .meta h3{ font-family:var(--hand); font-size:26px;}
  .role-card .meta p{
    margin:0; font-family:var(--label); font-size:16px; color:var(--ink-2); line-height:1.25;
  }
  .role-card .meta ul{
    margin:6px 0 0; padding:0; list-style:none;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .role-card .meta li{
    font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    color:var(--ink-3); text-transform:uppercase;
    border:1px dashed var(--ink-4); padding:2px 6px; border-radius:4px;
  }
  .role-card .arr{ font-family:var(--mono); font-size:24px; color:var(--ink-3);}

  /* Auth form */
  .auth{
    width:520px; height:680px;
    display:flex; flex-direction:column;
    border:1.5px solid var(--line); border-radius:14px;
    background:var(--paper); overflow:hidden;
    box-shadow:3px 3px 0 var(--shadow);
  }
  .auth .auth-top{
    height:60px; padding:0 22px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1.5px solid var(--line); background:var(--paper-2);
  }
  .auth .auth-top .badge{
    margin-left:auto;
    font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    border:1.5px solid var(--line); padding:3px 9px; border-radius:99px;
    background:var(--paper);
  }
  .auth .auth-body{
    flex:1; padding:30px 28px;
    display:flex; flex-direction:column; gap:14px;
  }
  .auth h2{ font-family:var(--hand); font-size:32px; line-height:1.05;}
  .auth .oauth{ display:flex; flex-direction:column; gap:8px;}
  .auth.admin-mode{ background:#16181c; color:var(--paper);}
  .auth.admin-mode .auth-top{ background:#0f1115; color:var(--paper); border-color:#3a3d42;}
  .auth.admin-mode .wf-input-row{ background:#1f2226; border-color:#3a3d42; color:var(--paper);}
  .auth.admin-mode .wf-input-text{ color:var(--paper);}
  .auth.admin-mode .mut{ color:#8a8880;}

  /* ============================================================
     BUYER DASHBOARD
     ============================================================ */
  .bdash{ width:1280px; height:820px;
    display:grid; grid-template-columns:230px 1fr; grid-template-rows:56px 1fr;
  }
  .bdash .topbar{
    grid-column:1/3; border-bottom:1.5px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 18px; background:var(--paper);
  }
  .bdash .sidebar{
    border-right:1.5px solid var(--line);
    padding:18px 14px; display:flex; flex-direction:column; gap:6px; background:var(--paper);
  }
  .bdash .main{
    padding:22px; display:flex; flex-direction:column; gap:16px;
    min-height:0; overflow:auto;
  }
  .bdash .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  .bdash .booking{
    display:grid; grid-template-columns:40px 1fr auto auto auto;
    gap:12px; align-items:center;
    padding:12px; border-bottom:1.5px dashed var(--ink-4);
  }
  .bdash .booking:last-child{ border-bottom:0; }
  .bdash .booking .nm{ font-family:var(--label); font-size:17px;}
  .bdash .booking .meta{ font-family:var(--mono); font-size:10px; color:var(--ink-3);}
  .bdash .booking .price{ font-family:var(--mono); font-size:13px; font-weight:600;}
  .pricing-table{ width:100%; border-collapse:collapse;}
  .pricing-table th, .pricing-table td{
    padding:10px 8px; text-align:left;
    border-bottom:1.5px dashed var(--ink-4);
    font-family:var(--label); font-size:16px;
  }
  .pricing-table th{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    color:var(--ink-3); text-transform:uppercase; font-weight:500;
    border-bottom:1.5px solid var(--line);
  }
  .pricing-table .ed{
    border:1.5px solid var(--line); padding:3px 8px; border-radius:4px;
    background:var(--paper); display:inline-flex; align-items:center; gap:5px;
    font-family:var(--mono); font-size:12px; font-weight:600;
  }

  /* ============================================================
     ADMIN
     ============================================================ */
  .admin{
    width:1280px; height:820px;
    display:grid; grid-template-columns:230px 1fr; grid-template-rows:56px 1fr;
  }
  .admin .topbar{
    grid-column:1/3; border-bottom:1.5px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 18px;
    background:#16181c; color:#fafaf7;
  }
  .admin .topbar .x{
    font-family:var(--mono); font-size:11px; color:#ff7a7a;
    border:1.5px solid #ff7a7a; padding:2px 8px; border-radius:99px;
  }
  .admin .sidebar{
    border-right:1.5px solid var(--line); padding:18px 14px;
    display:flex; flex-direction:column; gap:4px; background:var(--paper);
  }
  .admin .sidebar .ai{
    padding:8px 10px; border:1.5px solid transparent;
    border-radius:6px; font-family:var(--label); font-size:17px;
    cursor:pointer; display:flex; gap:8px; align-items:center;
  }
  .admin .sidebar .ai.active{
    background:var(--ink); color:var(--paper); border-color:var(--ink);
  }
  html[data-theme="dark"] .admin .sidebar .ai.active{
    background:var(--paper); color:var(--ink); border-color:var(--paper);
  }
  .admin .main{ padding:22px; overflow:auto; display:flex; flex-direction:column; gap:14px;}

  .heatmap{
    display:grid; grid-template-columns:repeat(10,1fr);
    grid-auto-rows:1fr; gap:2px;
    width:100%; aspect-ratio:1/1; max-width:520px;
    border:1.5px solid var(--line); padding:6px; background:var(--paper-2);
  }
  .heatmap .c{ background:var(--green-soft); border:1px solid var(--ink-4);}

  .classcard{
    border:1.5px solid var(--line); border-radius:8px; padding:10px;
    background:var(--paper); display:flex; flex-direction:column; gap:6px;
    box-shadow:2px 2px 0 var(--shadow);
  }
  .classcard .imgs{
    display:grid; grid-template-columns:repeat(4,1fr); gap:4px; height:80px;
  }
  .classcard .imgs .ph{
    background:repeating-linear-gradient(135deg, rgba(0,0,0,.05) 0 1px, transparent 1px 6px);
    border:1.5px dashed var(--ink-4); border-radius:4px;
    display:grid; place-items:center;
    font-family:var(--mono); font-size:9px; color:var(--ink-3);
  }
  .classcard .imgs .ph.filled{
    background:var(--green-soft); border-style:solid; border-color:var(--green-ink);
  }

  /* Mobile — additional pages */
  .m-listcard{
    border:1.5px solid var(--line); border-radius:10px; padding:12px;
    background:var(--paper);
    display:flex; flex-direction:column; gap:6px;
    box-shadow:2px 2px 0 var(--shadow);
  }
  .m-listcard .h{ display:flex; align-items:center; gap:10px;}
  .m-listcard .h .ic{
    width:40px;height:40px;border:1.5px solid var(--line); border-radius:8px;
    background:var(--green-soft); display:grid; place-items:center;
    font-family:var(--hand); font-size:18px; color:var(--green-ink);
  }
  .m-listcard .h .nm{ font-family:var(--label); font-size:17px; font-weight:600;}
  .m-listcard .h .meta{ font-family:var(--mono); font-size:10px; color:var(--ink-3);}

  .timeline{ position:relative; padding-left:18px;}
  .timeline::before{
    content:''; position:absolute; left:5px; top:6px; bottom:6px;
    border-left:1.5px dashed var(--ink-4);
  }
  .timeline-item{
    position:relative; padding:6px 0;
    display:grid; grid-template-columns:1fr auto; gap:8px;
  }
  .timeline-item::before{
    content:''; position:absolute; left:-17px; top:11px;
    width:10px; height:10px; border-radius:50%;
    background:var(--green); border:1.5px solid var(--line);
  }
  .timeline-item .t{ font-family:var(--label); font-size:16px;}
  .timeline-item .v{ font-family:var(--mono); font-size:12px; font-weight:600; color:var(--green-ink);}

  /* Flow diagram */
  .flow{
    width:1280px; height:820px; padding:32px; background:var(--paper); overflow:auto;
  }
  .flow h1{ font-size:32px; margin-bottom:10px;}
  .flow-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:14px;}
  .flow-node{
    border:1.5px solid var(--line); border-radius:10px;
    padding:12px; background:var(--paper);
    box-shadow:2px 2px 0 var(--shadow);
    display:flex; flex-direction:column; gap:6px; min-height:120px;
  }
  .flow-node h4{ font-family:var(--hand); font-size:18px; margin:0;}
  .flow-node .path{ font-family:var(--mono); font-size:11px; color:var(--green-ink);}
  .flow-node .role{
    font-family:var(--mono); font-size:9px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-3);
  }
  .flow-node ul{
    margin:4px 0 0; padding-left:14px; font-family:var(--label); font-size:14px; color:var(--ink-2);
  }
</style>
</head>
<body>

    <rect x="60" y="60" width="280" height="280" rx="56" fill="#22c55e" stroke="#1a1a1a" stroke-width="10" />
    <text x="200" y="240" text-anchor="middle"
          font-family="'Architects Daughter', cursive"
          font-size="180" font-weight="700" fill="#062040" letter-spacing="-10">G+</text>
  </svg>
</template>

<div class="theme-toggle" role="group" aria-label="theme">
  <button data-theme-btn="light">☀ light</button>
  <button data-theme-btn="dark" class="on">☾ dark</button>
</div>

<script>
  (function(){
    const KEY = 'gp-theme';
    const html = document.documentElement;
    const saved = localStorage.getItem(KEY) || 'dark';
    html.setAttribute('data-theme', saved);
    document.querySelectorAll('[data-theme-btn]').forEach(b=>{
      b.classList.toggle('on', b.dataset.themeBtn === saved);
      b.addEventListener('click', ()=>{
        const t = b.dataset.themeBtn;
        html.setAttribute('data-theme', t);
        localStorage.setItem(KEY, t);
        document.querySelectorAll('[data-theme-btn]').forEach(x=>{
          x.classList.toggle('on', x.dataset.themeBtn === t);
        });
      });
    });
  })();
</script>

<div id="root"></div>
