    <!-- ── Fonts — non-blocking load ─────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Load fonts without blocking render: use media="print" trick.
      The browser downloads in the background and switches rel to stylesheet on load.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Sarabun:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&family=Mitr:wght@400;500&display=swap"
    />
