version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      supabase:
        patterns: ["@supabase/*"]
      react:
        patterns: ["react", "react-dom", "react-*", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
    ignore:
      - dependency-name: "onnxruntime-web"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
