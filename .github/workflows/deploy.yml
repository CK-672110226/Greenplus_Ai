name: Deploy to Production

# Branch plan: main push only (after PR merge)
# Gate: lint must pass before deploy runs.
# Unit tests do NOT block prod deploy (continue-on-error in CI) —
# deploy.yml intentionally skips E2E to keep prod pipeline fast;
# E2E already ran as a gate in the PR via ci.yml.

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Stage 1: Lint gate — fail fast before touching production ───
  gate:
    name: Lint Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── Stage 2: Build + Deploy (needs lint gate) ───────────────────
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: gate
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel (Production)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
